<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ForgeLite Agent Console</title>
  <link rel="stylesheet" href="thinking-indicator.css">
  <link rel="stylesheet" href="console.css">
</head>
<body>
  <main class="shell">
    <header class="brand">
      <div><p class="eyebrow">Local coding agent</p><h1>ForgeLite</h1><p class="subtitle">模型负责规划，本地程序负责执行与证据。</p></div>
      <div class="thinking-control" data-thinking-control data-level="medium">
        <button class="thinking-trigger" data-thinking-trigger type="button" aria-expanded="false">
          <img class="thinking-icon" src="watch-indicator.svg" alt=""><span data-thinking-label>Medium</span><span class="thinking-chevron">⌄</span>
        </button>
        <div class="thinking-menu" data-thinking-menu hidden>
          <button class="thinking-option" data-thinking-option="low">Low — 快速、较少回合</button>
          <button class="thinking-option" data-thinking-option="medium" aria-current="true">Medium — 平衡</button>
          <button class="thinking-option" data-thinking-option="high">High — 更充分检查与验证</button>
        </div>
      </div>
    </header>
    <section class="panel">
      <form id="taskForm">
        <label for="task" class="eyebrow">Programming task</label>
        <textarea id="task" required placeholder="例如：检查这个工作区，修复失败测试并运行完整验证。"></textarea>
        <div class="actions"><span class="subtitle">工作区由启动命令固定，浏览器不能更改。</span><button id="runButton" class="run" type="submit">Run agent</button></div>
      </form>
      <p id="status" class="status">Ready.</p>
      <div class="result-grid">
        <article class="card"><h2>Agent result</h2><pre id="result">等待任务…</pre></article>
        <aside class="card"><h2>Credential-safe timeline</h2><ol id="timeline"></ol></aside>
      </div>
    </section>
  </main>
  <script src="thinking-indicator.js"></script>
  <script src="console.js"></script>
</body>
</html>
